name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger manually from GitHub UI

permissions:
  contents: write      # needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # GitHub Pages can't do server-side routing for SPAs.
      # This copies index.html → 404.html so GitHub serves the
      # React app even on direct URL hits like /about or /events.
      - name: Fix SPA routing (copy index.html → 404.html)
        run: cp dist/index.html dist/404.html

      # This file tells GitHub Pages to use your custom domain.
      - name: Write CNAME
        run: echo "axiomnsut.in" > dist/CNAME

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
